<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>SoundCloudX</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .card {
    position: absolute; inset: 16px;
    border-radius: 18px;
    background: radial-gradient(120% 90% at 50% 110%, rgba(255, 85, 0, .28), transparent 60%), #0f0f0f;
    border: 1px solid rgba(255, 255, 255, .08);
    box-shadow: 0 18px 50px rgba(0, 0, 0, .6);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; overflow: hidden;
    animation: in .5s cubic-bezier(.2, .9, .3, 1.15);
    -webkit-app-region: drag;
  }
  body.done .card { animation: out .26s ease-in forwards; }
  @keyframes in { from { transform: scale(.85); opacity: 0; } }
  @keyframes out { to { transform: scale(1.06); opacity: 0; } }

  .logo-wrap { position: relative; width: 74px; height: 74px; }
  .logo { width: 74px; height: 74px; border-radius: 18px; position: relative; z-index: 1;
    animation: pulse 1.2s ease-in-out infinite; box-shadow: 0 10px 30px rgba(255, 85, 0, .45); }
  .ring { position: absolute; inset: -6px; border-radius: 26px; border: 2px solid rgba(255, 85, 0, .7);
    animation: ring 1.2s ease-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }

  .name { margin-top: 14px; font-size: 26px; font-weight: 700; letter-spacing: .3px; }
  .name b { color: #ff5500; font-weight: 900; }

  .eq { display: flex; gap: 4px; align-items: flex-end; height: 22px; margin-top: 14px; }
  .eq i { width: 4px; border-radius: 2px; background: linear-gradient(#ffb347, #ff5500); animation: eq .9s ease-in-out infinite alternate; }
  .eq i:nth-child(1) { animation-delay: -.8s } .eq i:nth-child(2) { animation-delay: -.2s }
  .eq i:nth-child(3) { animation-delay: -.5s } .eq i:nth-child(4) { animation-delay: -.1s }
  .eq i:nth-child(5) { animation-delay: -.6s } .eq i:nth-child(6) { animation-delay: -.3s }
  .eq i:nth-child(7) { animation-delay: -.7s } .eq i:nth-child(8) { animation-delay: -.4s }
  @keyframes eq { from { height: 4px; } to { height: 22px; } }

  .bar { width: 180px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .1); margin-top: 16px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 2px; background: #ff5500; box-shadow: 0 0 10px #ff5500; animation: load 1.1s ease-in-out infinite; }
  @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(280%); } }

  .status { margin-top: 10px; font-size: 12px; color: #9a9a9a; }
  .by { position: absolute; bottom: 9px; font-size: 10.5px; color: #666; letter-spacing: .5px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap"><div class="ring"></div><img class="logo" src="icon.png" alt=""></div>
    <div class="name">SoundCloud<b>X</b></div>
    <div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="bar"><i></i></div>
    <div class="status" id="status">Loading SoundCloud…</div>
    <div class="by" id="by">SCX By W1CKIX</div>
  </div>
<script>
  const v = new URLSearchParams(location.search).get('v');
  if (v) document.getElementById('by').textContent = 'SCX By W1CKIX · v' + v;
  const msgs = ['Loading SoundCloud…', 'Waking up the speakers…', 'Tuning the bass…', 'Almost there…'];
  let i = 0;
  setInterval(() => { i = (i + 1) % msgs.length; document.getElementById('status').textContent = msgs[i]; }, 1600);
</script>
</body>
</html>

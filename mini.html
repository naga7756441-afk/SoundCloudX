<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>SoundCloudX Mini</title>
<style>
  :root { --acc: #ff5500; }
  .sbg { --bass: 0; }
  html, body {
    margin: 0; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  button { font-family: inherit; cursor: default; }

  .card {
    position: absolute; inset: 10px;
    box-sizing: border-box;
    color: #fff;
    background: rgba(32, 32, 32, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    -webkit-app-region: drag;
  }
  .nd { -webkit-app-region: no-drag; }
  .card { animation: cardIn .38s cubic-bezier(.2, .9, .3, 1.15); transform-origin: 100% 100%; }
  body.bye .card { animation: cardOut .2s ease-in forwards; }
  @keyframes cardIn { from { transform: translateY(24px) scale(.88); opacity: 0; } }
  @keyframes cardOut { to { transform: translateY(18px) scale(.9); opacity: 0; } }

  /* ---------- sound background ---------- */
  .sbg { position: absolute; inset: 0; display: none; z-index: 0; }
  body.has-sbg .sbg { display: block; }
  body.has-sbg .card { background: rgba(14, 14, 14, 0.96); }
  .sbg-img {
    position: absolute; inset: -30px;
    background: #222 center / cover no-repeat;
    filter: blur(18px) saturate(1.5);
    transform: scale(calc(1.08 + var(--bass) * .14));
    will-change: transform;
  }
  .sbg-dark { position: absolute; inset: 0; background: #000; opacity: calc(.7 - var(--bass) * .4); will-change: opacity; }
  .sbg-glow {
    position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 120%, var(--acc), transparent 70%);
    opacity: calc(var(--bass) * .5);
    will-change: opacity;
  }
  .sbg-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(0,0,0,0)); }

  #wave { display: none; position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 90px; pointer-events: none; opacity: .6; z-index: 0; }
  body.st-wave #wave { display: block; }

  /* ---------- full layout ---------- */
  .full { position: relative; z-index: 1; display: flex; height: 100%; }
  body.st-ultra .full { display: none; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 10px 14px 8px; }
  .head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #e6e6e6; }
  .logo { width: 18px; height: 18px; border-radius: 4px; }
  .head .sp { flex: 1; }
  .ib {
    -webkit-app-region: no-drag;
    width: 28px; height: 28px; flex: none;
    border: none; border-radius: 6px;
    background: rgba(255, 255, 255, 0.07);
    color: #ddd;
    font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets", sans-serif;
    font-size: 11px;
    display: grid; place-items: center;
    transition: background .12s, opacity .15s;
  }
  .ib:hover { background: rgba(255, 255, 255, 0.15); }
  .close { opacity: 0; }
  .card:hover .close { opacity: 1; }
  .close:hover { background: #c42b1c; color: #fff; }

  .info { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  .txt { flex: 1; min-width: 0; }
  .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 12px; color: #c8c8c8; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .art { width: 56px; height: 56px; flex: none; border-radius: 6px; background: #3a3a3a center / cover no-repeat; box-shadow: 0 4px 12px rgba(0,0,0,.4); }

  .ctrls { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: auto; }
  .cb {
    -webkit-app-region: no-drag;
    position: relative;
    width: 40px; height: 34px;
    border: none; border-radius: 8px;
    background: transparent;
    color: #fff;
    font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets", sans-serif;
    font-size: 15px;
    display: grid; place-items: center;
    overflow: hidden;
    transition: background .12s, transform .1s;
  }
  .cb svg { width: 20px; height: 20px; }
  .cb:hover { background: rgba(255, 255, 255, 0.1); }
  .cb:active { transform: scale(.9); }
  .cb.small { color: #cfcfcf; width: 36px; }
  .cb.play { width: 40px; height: 40px; border-radius: 50%; background: #fff; color: #111; font-size: 14px; }
  .cb.play:hover { background: #fff; box-shadow: 0 0 16px color-mix(in srgb, var(--acc) 70%, transparent); }

  .nextup {
    -webkit-app-region: no-drag;
    display: flex; align-items: center; gap: 7px;
    margin-top: 8px; padding: 4px 8px; border-radius: 7px;
    background: rgba(255, 255, 255, .06);
    font-size: 11.5px; color: #c4c4c4; overflow: hidden;
    transition: background .12s;
  }
  .nextup:hover { background: rgba(255, 255, 255, .12); color: #fff; }
  .nu-lbl { font-size: 9.5px; font-weight: 800; letter-spacing: 1px; color: var(--acc); }
  .nu-art { flex: none; width: 18px; height: 18px; border-radius: 3px; background: #444 center / cover no-repeat; }
  .nu-art.none { display: none; }
  .nu-txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nextup.nu-up { animation: nuUp .22s ease-in forwards; }
  .nextup.nu-down { animation: nuDown .22s ease-in forwards; }
  .nextup.nu-in { animation: nuIn .4s cubic-bezier(.2, .9, .3, 1.15); }
  @keyframes nuUp { to { transform: translateY(-26px) scale(.92); opacity: 0; } }
  @keyframes nuDown { to { transform: translateY(14px); opacity: 0; } }
  @keyframes nuIn { from { transform: translateY(16px); opacity: 0; } }
  .volrow { display: flex; align-items: center; gap: 8px; margin-top: 6px; height: 22px; }
  .spk {
    -webkit-app-region: no-drag;
    border: none; background: none; color: #ccc; padding: 0; width: 22px; height: 22px;
    font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets", sans-serif; font-size: 13px;
  }
  .spk:hover { color: #fff; }
  .pct, .time { font-size: 11px; color: #aaa; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pct { width: 30px; }
  .time { margin-left: 4px; }
  input[type=range] {
    -webkit-app-region: no-drag;
    -webkit-appearance: none; appearance: none;
    flex: 1; min-width: 40px; height: 4px; margin: 0;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--acc) var(--p, 100%), rgba(255,255,255,.2) var(--p, 100%));
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,.25); transition: transform .1s;
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.25); }

  .prog { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--acc); transition: width .7s linear; z-index: 2; box-shadow: 0 0 6px var(--acc); }

  /* ball style */
  .ballbox { display: none; flex: none; width: 150px; align-items: center; justify-content: center; }
  #ball { width: 150px; height: 150px; }
  body.st-ball .ballbox { display: flex; }
  body.st-ball .art { display: none; }
  body.st-ball .main { padding-left: 0; }
  body.st-ball .ctrls { gap: 2px; justify-content: space-between; }
  body.st-ball .cb.small { width: 32px; }
  body.st-ball .time { display: none; }

  /* ---------- ultra mini ---------- */
  .ultra { display: none; position: relative; z-index: 1; height: 100%; align-items: center; gap: 8px; padding: 0 10px 0 10px; box-sizing: border-box; }
  body.st-ultra .ultra { display: flex; }
  .uart { width: 52px; height: 52px; flex: none; border-radius: 8px; background: #3a3a3a center / cover no-repeat; box-shadow: 0 4px 12px rgba(0,0,0,.45); }
  .utxt { flex: 1; min-width: 0; margin-left: 2px; }
  .utxt .title { font-size: 13px; }
  .utxt .artist { font-size: 11px; margin-top: 1px; }
  .ultra .cb { width: 32px; height: 32px; font-size: 13px; }
  .ultra .cb.play { width: 34px; height: 34px; font-size: 12px; }
  .ultra .ib { width: 24px; height: 24px; font-size: 9px; }
  .ultra .close { opacity: 1; }

  /* ---------- animations ---------- */
  .pop { animation: pop .32s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
  .ripple {
    position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%; background: color-mix(in srgb, var(--acc) 60%, #fff);
    animation: ripple .5s ease-out forwards; pointer-events: none;
  }
  .cb.play .ripple { background: var(--acc); }
  @keyframes ripple { from { transform: scale(0); opacity: .55; } to { transform: scale(7); opacity: 0; } }

  .slide.out-l { animation: outL .2s ease-in forwards; }
  .slide.out-r { animation: outR .2s ease-in forwards; }
  .slide.in-r { animation: inR .38s cubic-bezier(.2, .9, .3, 1.15); }
  .slide.in-l { animation: inL .38s cubic-bezier(.2, .9, .3, 1.15); }
  @keyframes outL { to { transform: translateX(-36px); opacity: 0; } }
  @keyframes outR { to { transform: translateX(36px); opacity: 0; } }
  @keyframes inR { from { transform: translateX(36px); opacity: 0; } }
  @keyframes inL { from { transform: translateX(-36px); opacity: 0; } }
  .art.slide.out-l, .uart.slide.out-l { animation-name: artOutL; }
  .art.slide.out-r, .uart.slide.out-r { animation-name: artOutR; }
  .art.slide.in-r, .uart.slide.in-r, .art.slide.in-l, .uart.slide.in-l { animation-name: artIn; }
  @keyframes artOutL { to { transform: translateX(-20px) rotate(-12deg) scale(.7); opacity: 0; } }
  @keyframes artOutR { to { transform: translateX(20px) rotate(12deg) scale(.7); opacity: 0; } }
  @keyframes artIn { from { transform: scale(.6) rotate(8deg); opacity: 0; } }
</style>
</head>
<body class="st-classic">
  <div class="card" id="card">
    <div class="sbg" id="sbg"><div class="sbg-img" id="sbgImg"></div><div class="sbg-dark"></div><div class="sbg-glow"></div><div class="sbg-shade"></div></div>
    <canvas id="wave"></canvas>

    <!-- Classic / Ball / Wave -->
    <div class="full">
      <div class="ballbox"><canvas id="ball"></canvas></div>
      <div class="main">
        <div class="head">
          <img class="logo" src="icon.png" alt="">
          <span>SoundCloudX</span>
          <span class="sp"></span>
          <button class="ib close" data-act="close" title="Close mini player">&#xE8BB;</button>
          <button class="ib" data-act="open" title="Open SoundCloud">&#xE76C;</button>
        </div>
        <div class="info">
          <div class="txt slide">
            <div class="title js-title">Nothing playing</div>
            <div class="artist js-artist">Play a track in SoundCloud</div>
          </div>
          <div class="art js-art slide"></div>
        </div>
        <div class="nextup" id="nextup" title="Play next">
          <span class="nu-lbl">NEXT</span><i class="nu-art" id="nuArt"></i><span class="nu-txt" id="nuTxt">Autoplay</span>
        </div>
        <div class="ctrls">
          <button class="cb small" data-act="back5" title="Back 5 seconds">
            <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" font-family="Segoe UI, sans-serif">5</text></svg>
          </button>
          <button class="cb" data-act="prev" title="Previous">&#xE892;</button>
          <button class="cb play js-play" data-act="play" title="Play / Pause">&#xE768;</button>
          <button class="cb" data-act="next" title="Next">&#xE893;</button>
          <button class="cb small" data-act="fwd5" title="Forward 5 seconds">
            <svg viewBox="0 0 24 24"><g transform="translate(24 0) scale(-1 1)"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></g><text x="12" y="16.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" font-family="Segoe UI, sans-serif">5</text></svg>
          </button>
        </div>
        <div class="volrow">
          <button class="spk" id="spk" title="Mute">&#xE767;</button>
          <input type="range" id="vol" min="0" max="100" step="1" value="100" title="Volume">
          <span class="pct" id="pct">100%</span>
          <span class="time" id="time">0:00 / 0:00</span>
        </div>
      </div>
    </div>

    <!-- Ultra mini -->
    <div class="ultra">
      <div class="uart js-art slide nd" data-act="open" title="Open SoundCloud"></div>
      <div class="utxt slide">
        <div class="title js-title">Nothing playing</div>
        <div class="artist js-artist"></div>
      </div>
      <button class="cb" data-act="prev" title="Previous">&#xE892;</button>
      <button class="cb play js-play" data-act="play" title="Play / Pause">&#xE768;</button>
      <button class="cb" data-act="next" title="Next">&#xE893;</button>
      <button class="ib" data-act="open" title="Open SoundCloud">&#xE76C;</button>
      <button class="ib close" data-act="close" title="Close">&#xE8BB;</button>
    </div>

    <div class="prog" id="prog"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const $$ = (sel) => document.querySelectorAll(sel);
  const ICON_PLAY = '', ICON_PAUSE = '', ICON_VOL = '', ICON_MUTE = '';
  const dpr = window.devicePixelRatio || 1;
  const api = window.mini;
  const root = document.documentElement;
  const sbgEl = document.getElementById('sbg');

  let opts = { style: 'classic', soundBg: false };
  let playing = false;
  let curTitle = null;
  let lastArt = '';
  const artImg = new Image();

  // ---------------- buttons
  function pop(btn) {
    btn.classList.remove('pop');
    void btn.offsetWidth;
    btn.classList.add('pop');
    if (btn.classList.contains('cb')) {
      const r = document.createElement('span');
      r.className = 'ripple';
      btn.append(r);
      setTimeout(() => r.remove(), 520);
    }
  }

  let slideDir = null, slideAt = 0, slideTimer = 0;
  function slideOut(dir) {
    slideDir = dir;
    slideAt = performance.now();
    $$('.slide').forEach((s) => {
      s.classList.remove('in-l', 'in-r', 'out-l', 'out-r');
      void s.offsetWidth;
      s.classList.add(dir === 'next' ? 'out-l' : 'out-r');
    });
    const nu = $('nextup');
    nu.classList.remove('nu-up', 'nu-down', 'nu-in');
    void nu.offsetWidth;
    nu.classList.add(dir === 'next' ? 'nu-up' : 'nu-down');
    clearTimeout(slideTimer);
    slideTimer = setTimeout(() => slideIn(), 1600); // no new track came → bring it back
  }
  function slideIn() {
    const cls = slideDir === 'prev' ? 'in-l' : 'in-r';
    slideDir = null;
    clearTimeout(slideTimer);
    $$('.slide').forEach((s) => {
      s.classList.remove('in-l', 'in-r', 'out-l', 'out-r');
      void s.offsetWidth;
      s.classList.add(cls);
    });
    const nu = $('nextup');
    nu.classList.remove('nu-up', 'nu-down', 'nu-in');
    void nu.offsetWidth;
    nu.classList.add('nu-in');
  }

  const actions = {
    prev: () => { slideOut('prev'); api.control('prev'); },
    next: () => { slideOut('next'); api.control('next'); },
    play: () => api.control('play'),
    back5: () => api.control('seek', -5),
    fwd5: () => api.control('seek', 5),
    open: () => api.openMain(),
    close: () => api.close(),
  };
  $('nextup').addEventListener('click', () => {
    if (!nextList.length) return;
    slideOut('next');
    api.control('playNext', 0);
  });
  $$('[data-act]').forEach((b) => {
    b.addEventListener('click', () => {
      pop(b);
      actions[b.dataset.act]();
    });
  });

  api.onBye(() => document.body.classList.add('bye'));

  // ---------------- hotkeys: hold X and press P (mini player) or O (SoundCloudX)
  let xDown = false;
  addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'x') { xDown = true; return; }
    if (!xDown || e.repeat) return;
    if (k === 'p') { e.preventDefault(); api.hotkey('mini'); }
    else if (k === 'o') { e.preventDefault(); api.hotkey('main'); }
  });
  addEventListener('keyup', (e) => { if (e.key.toLowerCase() === 'x') xDown = false; });
  addEventListener('blur', () => { xDown = false; });

  // ---------------- volume
  const vol = $('vol');
  let volDragUntil = 0, volTimer = 0, muted = false;
  function showVol(v) {
    vol.value = Math.round(v * 100);
    vol.style.setProperty('--p', vol.value + '%');
    $('pct').textContent = vol.value + '%';
  }
  vol.addEventListener('input', () => {
    volDragUntil = performance.now() + 1500;
    vol.style.setProperty('--p', vol.value + '%');
    $('pct').textContent = vol.value + '%';
    clearTimeout(volTimer);
    volTimer = setTimeout(() => api.control('volume', vol.value / 100), 90);
  });
  vol.addEventListener('wheel', (e) => {
    e.preventDefault();
    const v = Math.max(0, Math.min(100, +vol.value + (e.deltaY < 0 ? 5 : -5)));
    vol.value = v;
    vol.dispatchEvent(new Event('input'));
  }, { passive: false });
  $('spk').addEventListener('click', () => { pop($('spk')); api.control('mute', true); });

  // ---------------- options + track
  function applyClasses() {
    document.body.className = 'st-' + opts.style + (opts.soundBg ? ' has-sbg' : '');
    sizeCanvases();
  }
  api.onOpts((o) => { opts = o; applyClasses(); });

  const fmt = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };

  let nextList = [];
  function renderNext(list) {
    nextList = list || [];
    const n = nextList[0];
    $('nuTxt').textContent = n ? n.title + (n.artist ? ' · ' + n.artist : '') : 'Autoplay picks similar tracks';
    $('nextup').title = n ? 'Play next: ' + n.title : '';
    const a = $('nuArt');
    a.classList.toggle('none', !(n && n.art));
    a.style.backgroundImage = n && n.art ? 'url("' + n.art + '")' : '';
  }

  function renderTrack(t) {
    renderNext(t.next);
    $$('.js-title').forEach((e) => { e.textContent = t.title || 'Nothing playing'; e.title = t.title || ''; });
    $$('.js-artist').forEach((e) => { e.textContent = t.artist || ''; });
    if (t.art !== lastArt) {
      lastArt = t.art;
      const bg = t.art ? 'url("' + t.art + '")' : '';
      $$('.js-art').forEach((e) => { e.style.backgroundImage = bg; });
      $('sbgImg').style.backgroundImage = bg;
      if (t.art) artImg.src = t.art;
    }
  }

  let pendingTrack = null;
  api.onTrack((t) => {
    if (!t) return;
    if (t.accent) root.style.setProperty('--acc', t.accent);

    const wasPlaying = playing;
    playing = !!t.playing;
    $$('.js-play').forEach((b) => {
      b.textContent = playing ? ICON_PAUSE : ICON_PLAY;
      if (wasPlaying !== playing) pop(b);
    });
    $('prog').style.width = Math.max(0, Math.min(1, t.progress || 0)) * 100 + '%';
    $('time').textContent = fmt(t.cur) + ' / ' + fmt(t.dur);
    muted = !!t.muted;
    $('spk').textContent = muted || t.vol === 0 ? ICON_MUTE : ICON_VOL;
    if (performance.now() > volDragUntil) showVol(muted ? 0 : t.vol);

    const key = (t.title || '') + '|' + (t.artist || '');
    if (curTitle === null) { curTitle = key; renderTrack(t); return; }
    if (key === curTitle) { renderTrack(t); return; }

    // new song → finish the slide-out, then slide the new one in
    curTitle = key;
    if (!slideDir) { slideDir = 'next'; slideAt = performance.now() - 200; }
    pendingTrack = t;
    const wait = Math.max(0, 200 - (performance.now() - slideAt));
    if (slideDir && !document.querySelector('.slide.out-l, .slide.out-r')) {
      renderTrack(t); pendingTrack = null; slideIn(); return;
    }
    setTimeout(() => {
      if (pendingTrack) { renderTrack(pendingTrack); pendingTrack = null; }
      slideIn();
    }, wait);
  });

  // ---------------- audio bands from the main window
  let bands = new Array(48).fill(0);
  let c1 = '#ff5500', c2 = '#ffb347';
  let lastBands = 0;
  api.onBands((d) => { bands = d.b; c1 = d.c1; c2 = d.c2; lastBands = performance.now(); });

  const ball = $('ball'), wave = $('wave');
  const bctx = ball.getContext('2d'), wctx = wave.getContext('2d');
  function sizeCanvases() {
    ball.width = ball.height = 150 * dpr;
    wave.width = (wave.clientWidth || 400) * dpr;
    wave.height = 90 * dpr;
  }
  sizeCanvases();

  let particles = [], bassAvg = 0, lastBeat = 0, spin = 0, bassSm = 0;
  const bassNow = () => { let s = 0; for (let i = 0; i < 5; i++) s += bands[i] || 0; return s / 5; };

  function drawBall(t) {
    const S = ball.width, c = S / 2;
    bctx.clearRect(0, 0, S, S);
    const bass = bassNow();
    if (bass > bassAvg * 1.3 + 0.07 && t - lastBeat > 170) {
      lastBeat = t;
      for (let i = 0; i < 8 + bass * 10; i++) {
        particles.push({ a: Math.random() * Math.PI * 2, d: 0, sp: S * (0.004 + Math.random() * 0.008), life: 1, size: S * (0.007 + Math.random() * 0.01) });
      }
    }
    bassAvg = bassAvg * 0.94 + bass * 0.06;
    if (playing) spin += 0.006;

    const r = S * 0.21 + bass * S * 0.04;
    bctx.save();
    bctx.translate(c, c);
    const N = 72;
    bctx.lineCap = 'round';
    bctx.lineWidth = S * 0.014;
    for (let i = 0; i < N; i++) {
      const idx = i < N / 2 ? i : N - 1 - i;
      const v = bands[Math.floor((idx / (N / 2)) * 47)] || 0;
      const ang = (i / N) * Math.PI * 2 - Math.PI / 2;
      const r0 = r + S * 0.035, r1 = r0 + S * 0.01 + v * S * 0.17;
      bctx.globalAlpha = 0.5 + 0.5 * v;
      bctx.strokeStyle = v > 0.45 ? c2 : c1;
      bctx.beginPath();
      bctx.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0);
      bctx.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
      bctx.stroke();
    }
    bctx.globalAlpha = 1;
    particles = particles.filter((p) => p.life > 0);
    for (const p of particles) {
      p.d += p.sp; p.life -= 0.025;
      const dist = r + S * 0.04 + p.d;
      bctx.globalAlpha = Math.max(0, p.life);
      bctx.fillStyle = c2;
      bctx.beginPath();
      bctx.arc(Math.cos(p.a) * dist, Math.sin(p.a) * dist, p.size * (0.5 + p.life * 0.5), 0, Math.PI * 2);
      bctx.fill();
    }
    bctx.globalAlpha = 1;
    bctx.shadowBlur = S * 0.06 * (0.4 + bass * 1.4);
    bctx.shadowColor = c1;
    bctx.lineWidth = S * 0.02;
    bctx.strokeStyle = c1;
    bctx.beginPath(); bctx.arc(0, 0, r, 0, Math.PI * 2); bctx.stroke();
    bctx.shadowBlur = 0;
    bctx.save();
    bctx.beginPath(); bctx.arc(0, 0, r - S * 0.008, 0, Math.PI * 2); bctx.clip();
    if (artImg.complete && artImg.naturalWidth) {
      bctx.rotate(spin);
      const d = (r - S * 0.008) * 2;
      bctx.drawImage(artImg, -d / 2, -d / 2, d, d);
    } else {
      bctx.fillStyle = c1; bctx.fillRect(-r, -r, r * 2, r * 2);
    }
    bctx.restore();
    bctx.fillStyle = 'rgba(24,24,24,.9)';
    bctx.beginPath(); bctx.arc(0, 0, r * 0.12, 0, Math.PI * 2); bctx.fill();
    bctx.restore();
  }

  function drawWave(t) {
    const W = wave.width, H = wave.height;
    wctx.clearRect(0, 0, W, H);
    const half = bands.slice(0, 32);
    const pts = half.slice().reverse().concat(half);
    const layer = (amp, alpha, phase) => {
      const n = pts.length;
      wctx.beginPath();
      wctx.moveTo(0, H);
      let px = 0, py = H;
      for (let i = 0; i < n; i++) {
        const wob = 0.85 + 0.15 * Math.sin(t / 500 + i * 0.4 + phase);
        const x = (i / (n - 1)) * W;
        const y = H - (0.05 + (pts[i] || 0) * amp * wob) * H;
        if (i === 0) wctx.lineTo(x, y);
        else wctx.quadraticCurveTo(px, py, (px + x) / 2, (py + y) / 2);
        px = x; py = y;
      }
      wctx.lineTo(W, py);
      wctx.lineTo(W, H);
      wctx.closePath();
      const g = wctx.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0, c2); g.addColorStop(0.5, c1); g.addColorStop(1, c2);
      wctx.globalAlpha = alpha;
      wctx.fillStyle = g;
      wctx.fill();
    };
    layer(1, 0.35, 1.7);
    layer(0.7, 0.8, 0);
    wctx.globalAlpha = 1;
  }

  function loop(t) {
    requestAnimationFrame(loop);
    if (t - lastBands > 400) bands = bands.map((v) => v * 0.9); // no sound → calm down
    if (opts.soundBg) {
      const b = bassNow();
      bassSm += (b - bassSm) * (b > bassSm ? 0.5 : 0.12);
      sbgEl.style.setProperty('--bass', bassSm.toFixed(3));
    }
    if (opts.style === 'ball') drawBall(t);
    else if (opts.style === 'wave') drawWave(t);
  }
  requestAnimationFrame(loop);
</script>
